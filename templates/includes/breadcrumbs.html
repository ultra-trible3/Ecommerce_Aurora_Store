{% load i18n %}
<nav class="au-breadcrumbs" aria-label="{% trans 'Breadcrumb' %}">
  <a href="{% url 'core:home' %}">{% trans "Home" %}</a>
  <i class="bi bi-chevron-right" aria-hidden="true"></i>
  {% if breadcrumbs %}
    {% for crumb in breadcrumbs %}
      {% if forloop.last %}
        <span class="current">{{ crumb.title }}</span>
      {% else %}
        <a href="{{ crumb.url }}">{{ crumb.title }}</a>
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      {% endif %}
    {% endfor %}
  {% elif crumb_label %}
    <span class="current">{{ crumb_label }}</span>
  {% endif %}
</nav>
